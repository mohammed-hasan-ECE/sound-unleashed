<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the stored appearance before the first paint so the page never
      // flashes the wrong theme. Storage can be unavailable (private mode,
      // blocked cookies); in that case fall back to the system preference.
      ;(function () {
        var key = 'sound-unleashed:theme:v1'
        var stored = null
        try {
          stored = window.localStorage.getItem(key)
        } catch (error) {
          stored = null
        }
        if (stored !== 'light' && stored !== 'dark' && stored !== 'system') {
          stored = null
        }
        var prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = stored === 'dark' || ((stored === null || stored === 'system') && prefersDark)
        var root = document.documentElement
        if (dark) root.classList.add('dark')
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <meta name="theme-color" content="#251036" />
    <meta
      name="description"
      content="Sound Unleashed is a music equipment discovery catalogue. Explore instruments and studio gear, compare retailer listings, and buy directly from the retailer you choose."
    />
    <title>Sound Unleashed — Find the Sound That Moves You</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
