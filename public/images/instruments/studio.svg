  <circle cx="310" cy="102" r="14" fill="#1a1a22"/>
  <circle cx="310" cy="102" r="7" fill="#863bff" opacity="0.6"/>
  <circle cx="310" cy="146" r="12" fill="url(#stcone)"/>
  <circle cx="310" cy="146" r="6" fill="#1a1a22"/>
