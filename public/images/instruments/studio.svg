  <rect x="164" y="176" width="30" height="10" rx="5" fill="#071a12"/>
  <rect x="165" y="177" width="14" height="8" rx="4" fill="#47e0a0"/>
  <rect x="206" y="176" width="30" height="10" rx="5" fill="#071a12"/>
