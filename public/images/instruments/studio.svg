<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="stmon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3d47"/>
      <stop offset="1" stop-color="#1a1a22"/>
    </linearGradient>
    <linearGradient id="stcone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5b68"/>
      <stop offset="1" stop-color="#2d2d38"/>
    </linearGradient>
    <linearGradient id="stacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#863bff"/>
      <stop offset="1" stop-color="#47bfff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="#F3EDFF"/>
  <!-- Left monitor -->
  <rect x="52" y="70" width="76" height="104" rx="8" fill="url(#stmon)"/>
