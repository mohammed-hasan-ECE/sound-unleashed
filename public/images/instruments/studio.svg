  <rect x="288" y="214" width="44" height="10" rx="5" fill="#1a1a22"/>
  <!-- Audio interface -->
  <rect x="150" y="140" width="100" height="56" rx="10" fill="url(#stmon)"/>
  <circle cx="172" cy="158" r="9" fill="#0d0d12" stroke="#3d3d47" stroke-width="2"/>
  <line x1="172" y1="151" x2="172" y2="158" stroke="#47bfff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="158" r="9" fill="#0d0d12" stroke="#3d3d47" stroke-width="2"/>
  <line x1="200" y1="151" x2="200" y2="158" stroke="#47bfff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="228" cy="158" r="9" fill="#0d0d12" stroke="#3d3d47" stroke-width="2"/>
  <line x1="228" y1="151" x2="228" y2="158" stroke="#47bfff" stroke-width="2" stroke-linecap="round"/>
