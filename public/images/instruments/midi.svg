<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="mshell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2d38"/>
      <stop offset="1" stop-color="#15151c"/>
    </linearGradient>
    <linearGradient id="mpad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#863bff"/>
      <stop offset="1" stop-color="#5b2bb8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="#F3EDFF"/>
  <!-- Controller body -->
  <rect x="50" y="70" width="300" height="160" rx="14" fill="url(#mshell)"/>
  <!-- Pad grid (MPC style) -->
  <g>
    <rect x="70" y="90" width="40" height="40" rx="6" fill="url(#mpad)"/>
    <rect x="118" y="90" width="40" height="40" rx="6" fill="url(#mpad)" opacity="0.85"/>
    <rect x="166" y="90" width="40" height="40" rx="6" fill="url(#mpad)" opacity="0.7"/>
    <rect x="70" y="138" width="40" height="40" rx="6" fill="url(#mpad)" opacity="0.7"/>
    <rect x="118" y="138" width="40" height="40" rx="6" fill="url(#mpad)" opacity="0.85"/>
    <rect x="166" y="138" width="40" height="40" rx="6" fill="url(#mpad)"/>
  </g>
  <!-- OLED display -->
  <rect x="70" y="188" width="136" height="30" rx="6" fill="#071a12" stroke="#3d3d47" stroke-width="2"/>
  <path d="M80 203 Q90 195 100 203 Q110 211 120 203 Q130 195 140 203 Q150 211 160 203 Q170 195 180 203" stroke="#47e0a0" stroke-width="1.5" fill="none"/>
  <!-- Knobs -->
  <circle cx="240" cy="106" r="14" fill="#3d3d47" stroke="#4a4a56" stroke-width="2"/>
  <line x1="240" y1="96" x2="240" y2="104" stroke="#e8e8ee" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="276" cy="106" r="14" fill="#3d3d47" stroke="#4a4a56" stroke-width="2"/>
  <line x1="276" y1="96" x2="276" y2="104" stroke="#e8e8ee" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="312" cy="106" r="14" fill="#3d3d47" stroke="#4a4a56" stroke-width="2"/>
  <line x1="312" y1="96" x2="312" y2="104" stroke="#e8e8ee" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mini keys -->
  <g fill="#fff" stroke="#c9c9d4" stroke-width="1">
    <rect x="238" y="138" width="26" height="50" rx="2"/>
    <rect x="266" y="138" width="26" height="50" rx="2"/>
    <rect x="294" y="138" width="26" height="50" rx="2"/>
    <rect x="322" y="138" width="22" height="50" rx="2"/>
  </g>
  <g fill="#1a1a22">
    <rect x="260" y="138" width="9" height="28" rx="1.5"/>
    <rect x="288" y="138" width="9" height="28" rx="1.5"/>
    <rect x="316" y="138" width="9" height="28" rx="1.5"/>
  </g>
  <!-- Accent strip -->
  <rect x="50" y="70" width="300" height="6" rx="3" fill="#863bff" opacity="0.9"/>
</svg>
